# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

name: CUHK-Student-Success-Assistant
kind: hosted
protocols:
  - protocol: responses
    version: 1.0.0
environment_variables:
  - name: PYTHONUTF8
    value: "1"
  - name: FOUNDRY_PROJECT_ENDPOINT
    value: ${FOUNDRY_PROJECT_ENDPOINT}
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: AZURE_SPEECH_KEY
    value: ${AZURE_SPEECH_KEY}
  - name: AZURE_SPEECH_REGION
    value: ${AZURE_SPEECH_REGION}
  - name: SPEECH_RESOURCE_ENDPOINT
    value: ${SPEECH_RESOURCE_ENDPOINT}
  - name: AZURE_STORAGE_ACCOUNT_NAME
    value: ${AZURE_STORAGE_ACCOUNT_NAME}
  - name: AZURE_STORAGE_ACCOUNT_KEY
    value: ${AZURE_STORAGE_ACCOUNT_KEY}
  - name: AZURE_BLOB_CONTAINER_NAME
    value: ${AZURE_BLOB_CONTAINER_NAME}
  - name: AZURE_STORAGE_ACCOUNT_URL
    value: ${AZURE_STORAGE_ACCOUNT_URL}
  - name: MEMORY_STORE_NAME
    value: ${MEMORY_STORE_NAME}
  - name: MEMORY_STORE_CHAT_MODEL_DEPLOYMENT_NAME
    value: ${MEMORY_STORE_CHAT_MODEL_DEPLOYMENT_NAME}
  - name: MEMORY_STORE_EMBEDDING_MODEL_DEPLOYMENT_NAME
    value: ${MEMORY_STORE_EMBEDDING_MODEL_DEPLOYMENT_NAME}
  - name: NYLAS_API_KEY
    value: ${NYLAS_API_KEY}
  - name: NYLAS_GRANT_ID
    value: ${NYLAS_GRANT_ID}
description: >
  An Agent Framework workflow hosted by Foundry.
metadata:
  tags:
    - Agent Framework
    - AI Agent Hosting
    - Azure AI AgentServer
    - Responses Protocol
    - Streaming
resources:
  cpu: '2.0'
  memory: 4.0Gi